# Project-wide Gradle settings.

# AndroidX is required by all modern Android dependencies.
android.useAndroidX=true

# Jetifier is intentionally disabled: the project only depends on AndroidX artifacts,
# so the legacy support-library rewriting pass is unnecessary and only slows down builds.
android.enableJetifier=false

# Non-transitive R classes reduce build time and memory usage.
android.nonTransitiveRClass=true

# Kotlin / Gradle performance
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.incremental=true

# Telegram API credentials.
# Provide them locally through one of the following (never commit real values):
#   1. this file (create a local copy that is not tracked),
#   2. local.properties,
#   3. environment variables TELEGRAM_API_ID / TELEGRAM_API_HASH.
# TELEGRAM_API_ID=0
# TELEGRAM_API_HASH=
