name: Build Telefarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      # Telegram credentials are optional for compiling. When the repository secrets are set the
      # resulting APK can actually sign in; otherwise the build only warns about them.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Make Gradle executable
        run: |
          chmod +x gradlew
          mkdir -p ci-logs

      # `set -o pipefail` keeps Gradle's exit code visible through `tee`. Without it a failed
      # Gradle build still reports a successful step, which is how a green run can produce no APK.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee ci-logs/testDebugUnitTest.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ci-logs/assembleDebug.log

      - name: Verify debug APK exists
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced by assembleDebug"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      # The APK is uploaded on its own, straight from the Gradle output directory. The artifact is
      # served as a single ZIP that contains app-debug.apk (no logs, no nested archives).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ci-logs/assembleRelease.log

      - name: Verify release APK exists
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced by assembleRelease"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-test-reports
          path: app/build/reports/tests/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-logs
          path: ci-logs/

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-reports
          path: app/build/reports/
