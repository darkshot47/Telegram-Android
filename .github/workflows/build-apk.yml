name: Build Telefarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  # Temporary: `contents: write` lets a failing test run publish its output to the branch,
  # because the run logs of this repository are not reachable from outside.
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      # Telegram credentials are optional for compiling. When the repository secrets are set the
      # resulting APK can actually sign in; otherwise the build only warns about them.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Make Gradle executable
        run: |
          chmod +x gradlew
          mkdir -p ci-logs

      # `set -o pipefail` keeps Gradle's exit code visible through `tee`. Without it a failed
      # Gradle build still reports a successful step, which is how a green run can produce no APK.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee ci-logs/test.log

      # Temporary step: publish the unit test output to the branch so it can be read while the
      # run logs are not reachable. It is removed again once the build is green.
      - name: Publish unit test output
        if: failure()
        continue-on-error: true
        run: |
          tail -c 30000 ci-logs/test.log > ci-test-failure.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add ci-test-failure.txt
          git commit -m "ci: unit test output [skip ci]" || true
          git push || true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ci-logs/assembleDebug.log

      # The upload below can only pass when a real APK is on disk, so the workflow can never
      # report success without a downloadable artifact.
      - name: Verify debug APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The release build reuses the debug signing configuration defined in app/build.gradle.kts,
      # so no signing secrets are required. It runs after the debug artifact was uploaded.
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ci-logs/assembleRelease.log

      - name: Verify release APK
        run: |
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-test-reports
          path: app/build/reports/tests/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-logs
          path: ci-logs/

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-reports
          path: app/build/reports/
