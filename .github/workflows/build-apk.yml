name: Build Telefarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      # Telegram credentials are optional for compiling. When the repository secrets are set the
      # resulting APK can actually sign in; otherwise the build only warns about them.
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Make Gradle executable
        run: |
          chmod +x gradlew
          mkdir -p ci-logs

      # The TDLib binding is not something this project can read from source, and the names it
      # gives a field are the only authority on what a call may pass. When a call is rejected the
      # signature is dumped here rather than guessed at, because guessing costs a build each time.
      - name: Dump the TDLib signatures a failing call needs
        if: always()
        run: |
          jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -name '*.jar' -path '*tdlib*' 2>/dev/null | head -1)
          echo "tdlib jar: ${jar:-none found}"
          if [ -n "$jar" ]; then
            for cls in 'TdApi$UserPrivacySettingRuleAllowUsers' 'TdApi$UserPrivacySettingRuleRestrictUsers' 'TdApi$InputMessageReplyToMessage' 'TdApi$MessageReplyToMessage' 'TdApi$SendMessage'; do
              javap -classpath "$jar" "org.drinkless.tdlib.$cls" 2>/dev/null \
                | grep -E 'public (long|java|int|boolean|org)' \
                | sed "s|^|::notice title=TDLib ${cls}::|"
            done
          fi

      # A failing step is unreadable through the raw log, which lives on a host outside the
      # ordinary API. Annotations are reachable through it, so the compiler's own complaint is
      # re-published there: one annotation per line, which is where the build actually failed.
      - name: Define the failure reporter
        run: |
          cat > ci-report.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # usage: ci-report.sh <log file> <step title>
          log="$1"
          title="$2"
          grep -E '^e: |error:|FAILED|Execution failed|Caused by|What went wrong' "$log" \
            | head -150 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
            | while IFS= read -r line; do
                echo "::error title=${title}::${line}"
              done
          SCRIPT
          chmod +x ci-report.sh
          mkdir -p ci-logs

      # `set -o pipefail` keeps Gradle's exit code visible through `tee`. Without it a failed
      # Gradle build still reports a successful step, which is how a green run can produce no APK.
      #
      # A failure is also copied into the job summary. Gradle's own output goes to the raw log and
      # to the uploaded artifact, and neither is readable without the results host; the summary is
      # reachable through the ordinary API, so the compiler's complaint about a failing build is
      # visible where the build is.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee ci-logs/test.log || {
            ./ci-report.sh ci-logs/test.log 'Unit tests'
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ci-logs/assembleDebug.log || {
            ./ci-report.sh ci-logs/assembleDebug.log 'Build debug APK'
            exit 1
          }

      # The upload below can only pass when a real APK is on disk, so the workflow can never
      # report success without a downloadable artifact.
      - name: Verify debug APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The release build reuses the debug signing configuration defined in app/build.gradle.kts,
      # so no signing secrets are required. It runs after the debug artifact was uploaded.
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ci-logs/assembleRelease.log || {
            ./ci-report.sh ci-logs/assembleRelease.log 'Build release APK'
            exit 1
          }

      - name: Verify release APK
        run: |
          ls -lah app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-test-reports
          path: app/build/reports/tests/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-logs
          path: ci-logs/

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Telefarm-build-reports
          path: app/build/reports/
