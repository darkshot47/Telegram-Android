name: TDLib API probe

# Temporary diagnostics: dumps the API surface of the exact TDLib binding artifact that the
# app depends on (io.github.tdlib-android:core). The dump is committed to the branch because
# the job log is not readable from every environment. Removed once it served its purpose.
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/tdlib-api-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    name: Dump TdApi surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download artifact and dump API
        continue-on-error: true
        run: |
          set +e
          exec > /tmp/diag.txt 2>&1
          echo "script started"
          trap 'echo "script exited with $?"' EXIT
          mkdir -p probe && cd probe
          BASE=https://repo1.maven.org/maven2/io/github/tdlib-android/core/0.1.1
          echo "===== directory listing ====="
          curl -sS -i "$BASE/" | head -40
          for f in core-0.1.1.pom core-0.1.1.aar core-0.1.1.jar core-0.1.1.module; do
            echo "===== $f ====="
            curl -sS -o "$f" -w "http_code=%{http_code} size=%{size_download}\n" "$BASE/$f" || true
          done
          echo "===== pom ====="
          cat core-0.1.1.pom 2>/dev/null | head -60
          ls -la
          for archive in core-0.1.1.aar core-0.1.1.jar; do
            [ -s "$archive" ] || continue
            echo "===== entries of $archive ====="
            unzip -l "$archive" | head -40
            unzip -o -q "$archive" -d aar
          done
          if [ -f aar/classes.jar ]; then
            unzip -o -q aar/classes.jar -d classes
          else
            mkdir -p classes
          fi
          echo "===== tdlib classes ====="
          ls classes/org/drinkless/tdlib | wc -l
          echo "===== auth classes ====="
          for c in \
            'org.drinkless.tdlib.Client' \
            'org.drinkless.tdlib.TdApi$RequestQrCodeAuthentication' \
            'org.drinkless.tdlib.TdApi$AuthorizationStateWaitOtherDeviceConfirmation' \
            'org.drinkless.tdlib.TdApi$AuthorizationStateWaitTdlibParameters' \
            'org.drinkless.tdlib.TdApi$SetAuthenticationPhoneNumber' \
            'org.drinkless.tdlib.TdApi$CheckAuthenticationCode' \
            'org.drinkless.tdlib.TdApi$ConfirmQrCodeAuthentication' \
            'org.drinkless.tdlib.TdApi$LogOut' \
            'org.drinkless.tdlib.TdApi$Close' \
            'org.drinkless.tdlib.TdApi$GetAuthorizationState' \
            'org.drinkless.tdlib.TdApi$SetTdlibParameters' \
            'org.drinkless.tdlib.TdApi$GetMessages' ; do
            echo "----- $c"
            javap -cp classes "$c" 2>&1 | head -25
          done
          echo "===== all auth-ish names ====="
          ls classes/org/drinkless/tdlib/ | sed 's/^TdApi//' | grep -E '^[A-Z]' | sort > /tmp/all_names.txt
          wc -l /tmp/all_names.txt
          grep -E "Authentication|Authorization|Session|QrCode|LoginToken|Password|Email|Registration|LogOut|Close|Destroy" /tmp/all_names.txt | head -80
          echo "===== native version strings ====="
          for f in aar/jni/*/*.so; do
            [ -f "$f" ] || continue
            echo "-- $f"
            grep -a -o -E "1\.8\.[0-9]+" "$f" | sort -u | head -5
          done
          echo "===== done ====="

      - name: Publish diagnostics to the branch
        if: always()
        run: |
          cp /tmp/diag.txt diag-tdlib-api.txt || echo "no diagnostics were produced" > diag-tdlib-api.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add diag-tdlib-api.txt
          git commit -m "ci: TDLib binding diagnostics [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
