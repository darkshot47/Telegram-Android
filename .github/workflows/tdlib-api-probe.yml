name: TDLib API probe

# Temporary diagnostics: dumps the API surface of the exact TDLib binding artifact
# that the app depends on (io.github.tdlib-android:core). Removed once the
# session-login implementation no longer needs it.
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/tdlib-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Dump TdApi surface
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download artifact
        run: |
          mkdir -p probe && cd probe
          BASE=https://repo1.maven.org/maven2/io/github/tdlib-android/core/0.1.1
          echo "===== directory listing ====="
          curl -sS -i "$BASE/" | head -40
          for f in core-0.1.1.pom core-0.1.1.aar core-0.1.1.jar core-0.1.1.module; do
            echo "===== $f ====="
            curl -sS -o "$f" -w "http_code=%{http_code} size=%{size_download}\n" "$BASE/$f" || true
            head -c 200 "$f" 2>/dev/null; echo
          done
          echo "===== search.maven.org ====="
          curl -sS "https://search.maven.org/solrsearch/select?q=g:io.github.tdlib-android&rows=20&wt=json" | head -c 2000 || true
          echo
          ls -la
          for archive in core-0.1.1.aar core-0.1.1.jar; do
            [ -s "$archive" ] || continue
            echo "===== entries of $archive ====="
            unzip -l "$archive" | head -40
            unzip -o -q "$archive" -d aar
          done
          if [ -f aar/classes.jar ]; then
            unzip -o -q aar/classes.jar -d classes
            echo "===== TdApi class count ====="
            ls classes/org/drinkless/tdlib | wc -l
          else
            mkdir -p classes && (cd classes && unzip -o -q ../core-0.1.1.jar) || true
            ls classes/org/drinkless/tdlib 2>/dev/null | wc -l
          fi

      - name: Dump authentication API
        run: |
          cd probe
          for c in \
            'org.drinkless.tdlib.TdApi$RequestQrCodeAuthentication' \
            'org.drinkless.tdlib.TdApi$AuthorizationStateWaitOtherDeviceConfirmation' \
            'org.drinkless.tdlib.TdApi$AuthorizationStateWaitTdlibParameters' \
            'org.drinkless.tdlib.TdApi$SetAuthenticationPhoneNumber' \
            'org.drinkless.tdlib.TdApi$CheckAuthenticationCode' \
            'org.drinkless.tdlib.TdApi$ConfirmQrCodeAuthentication' \
            'org.drinkless.tdlib.TdApi$LogOut' \
            'org.drinkless.tdlib.TdApi$Close' \
            'org.drinkless.tdlib.TdApi$Destroy' \
            'org.drinkless.tdlib.TdApi$SetTdlibParameters' \
            'org.drinkless.tdlib.TdApi$GetAuthorizationState' ; do
            echo "===== $c ====="
            javap -cp classes "$c" 2>&1 | head -25 || true
          done

      - name: Dump client and native version
        run: |
          cd probe
          echo "===== Client ====="
          javap -cp classes org.drinkless.tdlib.Client 2>&1 | head -40
          echo "===== Native version ====="
          for f in aar/jni/*/libtdjson.so aar/jni/*/*.so; do
            [ -f "$f" ] || continue
            echo "-- $f"
            grep -a -o -E "1\.8\.[0-9]+" "$f" | sort -u | head -5 || true
          done
          echo "===== TdApi auth names present ====="
          ls classes/org/drinkless/tdlib/ | grep -iE "QrCode|LoginToken|WebToken|Passkey|Session" | head -30

      - name: Dump every TdApi method class name
        run: |
          cd probe
          ls classes/org/drinkless/tdlib/ | sed 's/^TdApi//' | grep -E '^[A-Z]' | sort > /tmp/all_names.txt
          wc -l /tmp/all_names.txt
          echo "===== names containing our keywords ====="
          grep -E "Authentication|Authorization|Session|QrCode|LoginToken|Password|Email|Registration|LogOut|Close" /tmp/all_names.txt | head -100
          echo "===== vector field style (GetMessages) ====="
          javap -cp classes 'org.drinkless.tdlib.TdApi$GetMessages' 2>&1 | head -12
          echo "===== version markers in TdApi ====="
          grep -a -o -E "1\.8\.[0-9]+" classes/org/drinkless/tdlib/TdApi.class 2>/dev/null | sort -u | head -5
          echo "===== any layer constant ====="
          javap -cp classes -constants org.drinkless.tdlib.TdApi 2>&1 | grep -iE "layer|version" | head -10
